<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Produk — Toko Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter',sans-serif}
  .font-display{font-family:'Space Grotesk',sans-serif}
  .nav-link{display:flex;align-items:center;gap:.625rem;padding:.6rem .875rem;border-radius:.5rem;font-size:.875rem;color:#667085}
  .nav-link:hover{background:#F5F6F8;color:#101828}
  .nav-link.active{background:#DB2777;color:#fff}
</style>
</head>
<body class="bg-[#F5F6F8]">
<div class="flex h-screen overflow-hidden">

  <!-- Navigasi -->
  <aside class="w-60 shrink-0 bg-white border-r border-[#E4E7EC] flex flex-col p-4">
    <div class="flex items-center gap-2 px-2 mb-6">
      <div class="w-8 h-8 rounded-lg bg-[#DB2777] flex items-center justify-center">
        <span class="text-white font-display font-semibold text-xs">TA</span>
      </div>
      <span class="font-display font-semibold text-[#101828] text-base">Toko Admin</span>
    </div>
    <nav class="flex-1 space-y-1">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="products.html" class="nav-link active">Products</a>
      <a href="#" class="nav-link">Users</a>
      <a href="#" class="nav-link">Setting</a>
    </nav>
    <a href="index.html" class="nav-link border-t border-[#E4E7EC] mt-2 pt-4">Logout</a>
  </aside>

  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="h-16 shrink-0 bg-white border-b border-[#E4E7EC] flex items-center justify-between px-8">
      <h2 class="font-display font-semibold text-[#101828]">Add Produk</h2>
      <div class="w-8 h-8 rounded-full bg-[#DB2777] text-white text-xs font-medium flex items-center justify-center">AD</div>
    </header>

    <!-- Konten utama -->
    <main class="flex-1 overflow-y-auto p-8">
      <p class="text-xs font-medium text-[#DB2777] tracking-wide uppercase mb-2">Produk Baru</p>
      <h1 class="font-display font-semibold text-2xl text-[#101828] mb-1 tracking-tight">Add Produk</h1>
      <p class="text-sm text-[#667085] mb-6">Isi detail di bawah untuk menambahkan produk baru ke katalog tokomu.</p>

      <form onsubmit="event.preventDefault(); window.location.href='products.html';"
        class="bg-white rounded-xl border border-[#E4E7EC] p-6 max-w-xl space-y-4">

        <div>
          <label for="name" class="block text-sm font-medium text-[#101828] mb-1.5">Name</label>
          <input type="text" id="name" name="name" required placeholder="Contoh: Kemeja Linen Katun"
            class="w-full rounded-lg border border-[#E4E7EC] px-3.5 py-2.5 text-sm text-[#101828] placeholder:text-[#98A2B3] focus:outline-none focus:ring-2 focus:ring-[#DB2777]/40 focus:border-[#DB2777]">
        </div>

        <div>
          <label for="stock" class="block text-sm font-medium text-[#101828] mb-1.5">Stock</label>
          <input type="number" id="stock" name="stock" required min="0" placeholder="Contoh: 42"
            class="w-full rounded-lg border border-[#E4E7EC] px-3.5 py-2.5 text-sm text-[#101828] placeholder:text-[#98A2B3] focus:outline-none focus:ring-2 focus:ring-[#DB2777]/40 focus:border-[#DB2777]">
        </div>

        <div>
          <label for="description" class="block text-sm font-medium text-[#101828] mb-1.5">Description</label>
          <textarea id="description" name="description" rows="4" placeholder="Deskripsikan produk secara singkat"
            class="w-full rounded-lg border border-[#E4E7EC] px-3.5 py-2.5 text-sm text-[#101828] placeholder:text-[#98A2B3] focus:outline-none focus:ring-2 focus:ring-[#DB2777]/40 focus:border-[#DB2777]"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <a href="products.html" class="rounded-lg border border-[#E4E7EC] text-[#101828] text-sm font-medium px-4 py-2.5 hover:bg-[#F5F6F8] transition-colors">Cancel</a>
          <button type="submit" class="rounded-lg bg-[#DB2777] text-white text-sm font-medium px-4 py-2.5 hover:bg-[#BE185D] transition-colors">Submit</button>
        </div>
      </form>
    </main>

    <!-- Footer -->
    <footer class="h-12 shrink-0 bg-white border-t border-[#E4E7EC] flex items-center justify-center">
      <p class="text-xs text-[#98A2B3]">© 2026 Toko Admin. All rights reserved.</p>
    </footer>
  </div>

</div>
</body>
</html>
