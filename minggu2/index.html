<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Toko Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter',sans-serif}
  .font-display{font-family:'Space Grotesk',sans-serif}
</style>
</head>
<body class="min-h-screen bg-[#101828] flex items-center justify-center p-6">

  <div class="w-full max-w-sm">
    <div class="flex items-center gap-2 justify-center mb-8">
      <div class="w-9 h-9 rounded-lg bg-[#DB2777] flex items-center justify-center">
        <span class="text-white font-display font-semibold text-sm">TA</span>
      </div>
      <span class="font-display font-semibold text-lg text-white">Toko Admin</span>
    </div>

    <div class="bg-white rounded-xl border border-white/10 p-8">
      <p class="text-xs font-medium text-[#DB2777] tracking-wide uppercase mb-2">Selamat Datang</p>
      <h1 class="font-display font-semibold text-xl text-[#101828] mb-1 tracking-tight">Masuk ke Akun Kamu</h1>
      <p class="text-sm text-[#667085] mb-6">Satu pintu untuk mengelola seluruh operasional tokomu.</p>

      <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';" class="space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-[#101828] mb-1.5">Username</label>
          <input type="text" id="username" name="username" required placeholder="Masukkan username"
            class="w-full rounded-lg border border-[#E4E7EC] px-3.5 py-2.5 text-sm text-[#101828] placeholder:text-[#98A2B3] focus:outline-none focus:ring-2 focus:ring-[#DB2777]/40 focus:border-[#DB2777]">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-[#101828] mb-1.5">Password</label>
          <input type="password" id="password" name="password" required placeholder="Masukkan password"
            class="w-full rounded-lg border border-[#E4E7EC] px-3.5 py-2.5 text-sm text-[#101828] placeholder:text-[#98A2B3] focus:outline-none focus:ring-2 focus:ring-[#DB2777]/40 focus:border-[#DB2777]">
        </div>
        <button type="submit"
          class="w-full rounded-lg bg-[#DB2777] text-white text-sm font-medium py-2.5 hover:bg-[#BE185D] transition-colors">
          Login
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-white/40 mt-6">© 2026 Toko Admin</p>
  </div>

</body>
</html>
